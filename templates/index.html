<!DOCTYPE html>
<html>
<head>
    <title>InfraScan – Road Damage Reporter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        #map { height: 400px; width: 100%; }
        body { font-family: Arial; padding: 20px; }
    </style>
</head>
<body>
    <h2>Upload Road Damage</h2>
    <form id="uploadForm" enctype="multipart/form-data">
        <input type="file" name="image" required><br><br>
        <input type="hidden" name="latitude" id="latitude">
        <input type="hidden" name="longitude" id="longitude">
        <button type="submit">Submit</button>
    </form>

    <h2>Damage Locations</h2>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        const form = document.getElementById('uploadForm');
        const latInput = document.getElementById('latitude');
        const lonInput = document.getElementById('longitude');

        navigator.geolocation.getCurrentPosition(
            pos => {
                latInput.value = pos.coords.latitude;
                lonInput.value = pos.coords.longitude;
            },
            err => {
                alert("Could not get location automatically. You will have to enter it manually.");
            }
        );

        form.onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(form);

            const res = await fetch('/upload', { method: 'POST', body: formData });
            const data = await res.json();
            alert("Uploaded: " + data.prediction);

            location.reload();
        };

        const map = L.map('map').setView([20, 78], 5);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        fetch('/reports')
            .then(res => res.json())
            .then(data => {
                data.forEach(report => {
                    if (report.latitude && report.longitude) {
                        const marker = L.marker([report.latitude, report.longitude]).addTo(map);
                        marker.bindPopup(`<b>${report.prediction}</b><br><img src="static/uploads/${report.image}" width="100" />`);
                        

                    }
                });
            });
    </script>
</body>
</html>
